    <title>Aula Formulário</title>
</head>
<body>
    <H2>Formulários Aula 10-11</H2>

    <form>
         <label for="nomeCompleto">Nome completo:</label>
        <input type="text" id="nomeCompleto" placeholder="Ex: Daniel Felix" required>

        <p><label for="email">E-mail:</label>
        <input type="text" id="email" placeholder="Ex: email@email.com" required></p>

        <p>
        <label for="senha">Senha: </label>
        <input type="password" id="senha" placeholder="Ex: 123456" required></p>
        </p>

        <button type="submit">Enviar cadastro</button>
    </form>
       
    
</body>
</html>
